name: Verify PoC
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: node --check mcp/server.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: npm run build:wasm
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawlight-browser-test-results
          path: test-results/
          if-no-files-found: ignore
  gleam:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.14.0'
          rebar3-version: '3'
      - run: gleam check
      - name: Smoke test Gleam HTTP persistence
        run: |
          gleam run > /tmp/drawlight-gleam.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/drawlight-gleam.log
            exit 1
          fi
          curl -fsS -X PUT http://127.0.0.1:8000/diagram \
            -H 'Content-Type: application/json' \
            -d '{"version":1,"title":"Smoke","nodes":[],"edges":[]}'
          curl -fsS http://127.0.0.1:8000/diagram | grep -F '"title":"Smoke"'
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path geometry/Cargo.toml
